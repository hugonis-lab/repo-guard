[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-guard"
version = "0.1.0"
description = "Deterministic global Git hooks and 12-Factor open-source hygiene guardrail"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
repo-guard = "repo_guard.cli:main"

[project.urls]
Homepage = "https://github.com/hugonis-lab/repo-guard"
Repository = "https://github.com/hugonis-lab/repo-guard"
Issues = "https://github.com/hugonis-lab/repo-guard/issues"

[tool.setuptools.packages.find]
include = ["repo_guard*"]
